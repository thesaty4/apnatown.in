name: apnatown-local
services:
  postgres:
    image: ghcr.io/baosystems/postgis:17-3.5@sha256:75e3391d48e13538928fd26141b30f12c7587d937919c6656f3967f176af7701
    environment:
      POSTGRES_USER: apnatown_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:local first}
      POSTGRES_DB: apnatown_local
    ports:
      # Host port 5434: 5432/5433 are commonly taken by a Windows or WSL PostgreSQL on dev machines.
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apnatown_migrator -d apnatown_local']
      interval: 3s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s
volumes:
  postgres-data:
