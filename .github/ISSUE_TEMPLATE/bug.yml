name: Bug report
description: Report a bug for the owning developer-backend/developer-frontend agent or a human to triage.
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: area
    attributes:
      label: Area / module
      description: Which part of ApnaTown (see docs/architecture.md module map, or a frontend area like Explore/Reels/Checkout).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include role (customer/vendor/provider/rider/admin/super_admin), device/connection if relevant, and language (EN/HI).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Blocker (data loss, security, money incorrect, invariant violated)"
        - "Major (feature broken for a role/journey)"
        - "Minor (cosmetic/edge case)"
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive area
      description: Check all that apply — these require a security-auditor PASS before the owning developer opens a PR.
      options:
        - label: Touches auth
        - label: Touches payments
        - label: Touches uploads/CSV
        - label: Touches embeds
        - label: Touches admin permissions
        - label: Touches communications
