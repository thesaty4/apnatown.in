name: Spec request
description: Request linked BE/FE specs for a feature in docs/FEATURE_INVENTORY.md, for architect in specification mode.
title: "[spec]: "
labels: ["spec-request"]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: From docs/FEATURE_INVENTORY.md (e.g. SV5, AD12).
      placeholder: "SV5"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      description: See docs/architecture.md.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything beyond the one-line description in docs/FEATURE_INVENTORY.md that architect should know — related journeys (docs/project/06-user-journeys.md, J1-J14), dependencies on other specs, known constraints.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Known open questions
      description: Anything already known to be ambiguous — architect will ask for clarification and record open questions in the owning spec.
    validations:
      required: false
