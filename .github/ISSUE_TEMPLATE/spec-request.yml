name: Spec request
description: Request a BE/FE spec be written for a feature in docs/FEATURE_INVENTORY.md, for the spec-writer agent.
title: "[spec]: "
labels: ["spec-request"]
body:
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: From docs/FEATURE_INVENTORY.md (e.g. SV5, AD12).
      placeholder: "SV5"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      description: See docs/architecture.md.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything beyond the one-line description in docs/FEATURE_INVENTORY.md that the spec-writer agent should know — related journeys (docs/PROJECT.md J1-J10), dependencies on other specs, known constraints.
    validations:
      required: false
  - type: textarea
    id: open-questions
    attributes:
      label: Known open questions
      description: Anything already known to be ambiguous — the spec-writer agent will add these to docs/PROJECT.md "Open questions" if not already recorded.
    validations:
      required: false
