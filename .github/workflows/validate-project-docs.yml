name: Validate project docs

on:
  pull_request:
    paths:
      - "docs/PROJECT.md"
      - "docs/project/**"
      - "scripts/validate-project-docs.mjs"
  push:
    branches: [main]
    paths:
      - "docs/PROJECT.md"
      - "docs/project/**"
      - "scripts/validate-project-docs.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-project-docs.mjs
