name: CodeQL
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@580756e7e588fa10825f985839af2db114786336
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@580756e7e588fa10825f985839af2db114786336
