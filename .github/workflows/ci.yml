name: Scaffold CI
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  c00:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned workspace
        run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - name: Generate and check contracts
        run: |
          npx --yes pnpm@10.34.9 env:local
          npx --yes pnpm@10.34.9 check:generated
          npx --yes pnpm@10.34.9 generate
        env:
          APP_ENV: test
      - name: Validate scaffold
        run: |
          npx --yes pnpm@10.34.9 lint
          npx --yes pnpm@10.34.9 typecheck
          npx --yes pnpm@10.34.9 test
          npx --yes pnpm@10.34.9 build
          npx --yes pnpm@10.34.9 test:exports
          node scripts/check-spec-coverage.mjs
          node scripts/validate-ai-setup.mjs
          git diff --check
      - name: Start isolated local database
        run: npx --yes pnpm@10.34.9 db:up
      - name: Verify database isolation and privileges
        run: npx --yes pnpm@10.34.9 test:db
      - name: Install pinned browser
        run: npx --yes pnpm@10.34.9 exec playwright install --with-deps chromium
      - name: All C00 browser checks
        run: npx --yes pnpm@10.34.9 test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c00-browser-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop database without deleting its volume
        if: always()
        run: npx --yes pnpm@10.34.9 db:down
