name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-ai-setup:
    name: Validate AI lifecycle setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-ai-setup.mjs

  install-and-test:
    name: Install, lint, build, test
    runs-on: ubuntu-latest
    # No-ops until apps/web and apps/api exist with package.json files.
    # `--if-present` makes each script a clean no-op when absent, and
    # still fails the job if a present script actually fails.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: "9" # TODO(verify): pin to the repo's actual pnpm version once apps/ exist
      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present lint
      - name: Build
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present build
      - name: Test
        if: hashFiles('package.json') != ''
        run: pnpm run --if-present test
