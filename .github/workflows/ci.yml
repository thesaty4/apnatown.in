name: Scaffold CI
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  c00:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned workspace
        run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - name: Generate and check contracts
        run: |
          npx --yes pnpm@10.34.9 env:local
          npx --yes pnpm@10.34.9 check:generated
          npx --yes pnpm@10.34.9 generate
        env:
          APP_ENV: local
      - name: Validate scaffold
        run: |
          npx --yes pnpm@10.34.9 lint
          npx --yes pnpm@10.34.9 typecheck
          npx --yes pnpm@10.34.9 build
          node scripts/check-spec-coverage.mjs
          node scripts/validate-ai-setup.mjs
          git diff --check
