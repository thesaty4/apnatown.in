name: "Copilot Setup Steps"

# This workflow pre-installs the environment GitHub Copilot coding
# agents work in, per GitHub's "copilot-setup-steps" convention. The
# job must be named exactly `copilot-setup-steps`.
# TODO(verify): confirm the final Node/pnpm versions once apps/web and
# apps/api are scaffolded with real package.json files.

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Install dependencies (if a lockfile exists)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "No pnpm-lock.yaml yet — nothing to install."
          fi
