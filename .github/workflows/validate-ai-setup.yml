name: Validate AI lifecycle setup

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"
      - "specs/**"
      - "scripts/validate-ai-setup.mjs"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "docs/**"
      - "specs/**"
      - "scripts/validate-ai-setup.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-ai-setup.mjs
