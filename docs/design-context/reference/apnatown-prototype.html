<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ApnaTown.in | Padrauna’s local marketplace</title>
<meta name="description" content="ApnaTown.in: discover shops, products and services in Padrauna, Kushinagar. Order for home delivery or self-pickup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF5;--surface:#FFFFFF;--surface-2:#FAF4EA;--border:#E7DFD3;--border-strong:#CFC3B2;
  --text:#1F1A14;--text-2:#5A5045;--muted:#6F6457;--overlay:rgba(31,26,20,.55);
  --primary:#C2410C;--on-primary:#FFFFFF;--primary-soft:#FFEDD5;--primary-ink:#7C2D12;
  --secondary:#0F766E;--secondary-soft:#CCFBF1;--accent:#F59E0B;--accent-ink:#451A03;
  --success:#15803D;--success-soft:#DCFCE7;--warning:#B45309;--warning-soft:#FEF3C7;
  --error:#B91C1C;--error-soft:#FEE2E2;--info:#1D4ED8;--info-soft:#DBEAFE;
  --star:#F59E0B;--offer:#A3166B;--offer-soft:#FCE7F3;
  --st-placed:#1D4ED8;--st-accepted:#0F766E;--st-preparing:#B45309;--st-ready:#6D28D9;--st-out:#C2410C;--st-delivered:#15803D;--st-cancelled:#B91C1C;--st-refunded:#475569;
  --ap-pending:#B45309;--ap-approved:#15803D;--ap-rejected:#B91C1C;--ap-suspended:#6D28D9;--ap-inactive:#57534E;
  --font-display:"Poppins","Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  --font-body:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-xs:6px;--r-sm:10px;--r-md:14px;--r-lg:20px;--r-pill:999px;
  --sh-1:0 1px 2px rgba(60,40,20,.08),0 1px 3px rgba(60,40,20,.06);
  --sh-2:0 4px 12px rgba(60,40,20,.10),0 2px 4px rgba(60,40,20,.06);
  --sh-3:0 16px 40px rgba(60,40,20,.18);
  --dur-1:120ms;--dur-2:220ms;--dur-3:380ms;--ease:cubic-bezier(.2,.8,.2,1);
  --nav-h:56px;--tab-h:60px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#14110D;--surface:#1E1913;--surface-2:#27211A;--border:#3A3228;--border-strong:#51463A;
  --text:#F6EFE6;--text-2:#D2C7B9;--muted:#A89C8B;--overlay:rgba(0,0,0,.7);
  --primary:#FB923C;--on-primary:#1F1A14;--primary-soft:#3B2113;--primary-ink:#FED7AA;
  --secondary:#2DD4BF;--secondary-soft:#0E2F2B;--accent:#FBBF24;
  --success:#4ADE80;--success-soft:#10301C;--warning:#FBBF24;--warning-soft:#3A2A0B;--error:#F87171;--error-soft:#3F1515;--info:#93C5FD;--info-soft:#14243F;
  --offer:#F472B6;--offer-soft:#3A1429;
  --st-placed:#93C5FD;--st-accepted:#2DD4BF;--st-preparing:#FBBF24;--st-ready:#C4B5FD;--st-out:#FB923C;--st-delivered:#4ADE80;--st-cancelled:#F87171;--st-refunded:#CBD5E1;
  --ap-pending:#FBBF24;--ap-approved:#4ADE80;--ap-rejected:#F87171;--ap-suspended:#C4B5FD;--ap-inactive:#D6D3D1;
  --sh-1:0 1px 2px rgba(0,0,0,.5);--sh-2:0 4px 12px rgba(0,0,0,.5);--sh-3:0 16px 40px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110D;--surface:#1E1913;--surface-2:#27211A;--border:#3A3228;--border-strong:#51463A;
  --text:#F6EFE6;--text-2:#D2C7B9;--muted:#A89C8B;--overlay:rgba(0,0,0,.7);
  --primary:#FB923C;--on-primary:#1F1A14;--primary-soft:#3B2113;--primary-ink:#FED7AA;
  --secondary:#2DD4BF;--secondary-soft:#0E2F2B;--accent:#FBBF24;
  --success:#4ADE80;--success-soft:#10301C;--warning:#FBBF24;--warning-soft:#3A2A0B;--error:#F87171;--error-soft:#3F1515;--info:#93C5FD;--info-soft:#14243F;
  --offer:#F472B6;--offer-soft:#3A1429;
  --st-placed:#93C5FD;--st-accepted:#2DD4BF;--st-preparing:#FBBF24;--st-ready:#C4B5FD;--st-out:#FB923C;--st-delivered:#4ADE80;--st-cancelled:#F87171;--st-refunded:#CBD5E1;
  --ap-pending:#FBBF24;--ap-approved:#4ADE80;--ap-rejected:#F87171;--ap-suspended:#C4B5FD;--ap-inactive:#D6D3D1;
  --sh-1:0 1px 2px rgba(0,0,0,.5);--sh-2:0 4px 12px rgba(0,0,0,.5);--sh-3:0 16px 40px rgba(0,0,0,.6);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + var(--sat) + 8px);scroll-padding-bottom:calc(var(--tab-h) + var(--sab) + 24px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font-body);min-height:100vh;overflow-x:hidden}
:root{padding-top:var(--sat);padding-bottom:var(--sab)}
h1,h2,h3,h4,h5,h6,p{margin:0}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.25;letter-spacing:-.01em}
h1{font-size:1.75rem}h2{font-size:1.4rem}h3{font-size:1.15rem}h4{font-size:1rem}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 14px;z-index:300;border-radius:8px}
.skip:focus{left:8px}
@media (min-width:900px){h1{font-size:2.2rem}h2{font-size:1.65rem}}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.fill{fill:currentColor}
.wrap{width:min(1200px,100% - 28px);margin-inline:auto}
.stack{display:grid;gap:14px}.stack-lg{display:grid;gap:22px}.row{display:flex;align-items:center;gap:10px}.row.wrap-r{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.t2{color:var(--text-2)}.small{font-size:.875rem}.xs{font-size:.78rem}.center{text-align:center}.right{text-align:right}.bold{font-weight:600}
.price{font:700 1.1rem var(--font-display)}.mrp{color:var(--muted);text-decoration:line-through;font-size:.85rem;margin-left:6px;font-weight:400}.off{color:var(--offer);font-weight:600;font-size:.85rem;margin-left:6px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* top app bar */
.top{position:sticky;top:var(--sat);z-index:60;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--sh-1)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:var(--nav-h);padding-block:6px}
.top .locbar{flex:none;max-width:46%}.top .locbar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
@media (min-width:900px){.top .wrap{flex-wrap:nowrap}.top .locbar{max-width:none}}
.logo{display:flex;align-items:center;gap:8px;font:700 1.15rem var(--font-display);color:var(--text)}
.logo b{color:var(--primary)}
.logo svg{width:30px;height:30px}
.iconbtn{width:44px;height:44px;border-radius:var(--r-pill);border:0;background:transparent;display:grid;place-items:center;position:relative;color:var(--text)}
.iconbtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:var(--on-primary);font:600 .68rem/18px var(--font-body);text-align:center;padding:0 4px}
.locbar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:6px 12px;min-height:44px;max-width:100%;text-align:left}
.locbar small{display:block;color:var(--muted);font-size:.7rem;line-height:1.1}
.locbar strong{display:block;font-size:.88rem;line-height:1.2}
.deskmenu{display:none;gap:4px;margin-left:8px}
.deskmenu a{padding:10px 12px;border-radius:var(--r-sm);font-weight:500}
.deskmenu a:hover,.deskmenu a.on{background:var(--primary-soft);color:var(--primary-ink)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sab);box-shadow:0 -2px 10px rgba(60,40,20,.08)}
.bottom a,.bottom button{flex:1;min-height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--muted);border:0;background:none;position:relative}
.bottom .on{color:var(--primary)}
.bottom .on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.bottom .dot{top:6px;right:calc(50% - 22px)}
main{min-height:60vh;padding:14px 0 calc(var(--tab-h) + var(--sab) + 90px)}
.dash-wrap{display:block}
.side{display:none}
@media (min-width:900px){
  .deskmenu{display:flex}
  .bottom.cust{display:none}
  main{padding-bottom:50px}
  .dash-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - var(--nav-h))}
  .side{display:block;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:calc(var(--nav-h) + var(--sat));height:calc(100vh - var(--nav-h) - var(--sat));overflow:auto}
  .bottom.dash{display:none}
  .dash-wrap main{padding-inline:22px}
}
.side a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r-sm);font-weight:500;color:var(--text-2);min-height:44px}
.side a:hover{background:var(--surface-2)}
.side a.on{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.side h6{font:600 .7rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 12px 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);border:2px solid transparent;font:600 1rem var(--font-body);cursor:pointer;transition:transform var(--dur-1) var(--ease),background var(--dur-2),box-shadow var(--dur-2);white-space:nowrap;text-align:center}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--primary);color:var(--on-primary)}.btn.p:hover{filter:brightness(.93)}
.btn.s{background:var(--secondary);color:var(--surface)}
.btn.o{background:transparent;border-color:var(--primary);color:var(--primary)}
.btn.t{background:transparent;color:var(--primary);padding:0 12px}.btn.t:hover{background:var(--primary-soft)}
.btn.d{background:var(--error);color:#fff}
.btn.g{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none}
.btn.loading::after{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.actionbar{position:sticky;top:calc(var(--nav-h) + var(--sat));z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;margin:0 -14px;padding-inline:14px;display:flex;gap:8px;overflow-x:auto}
.actionbar .btn{flex:1;min-width:84px;padding:0 10px;font-size:.88rem;min-height:44px;flex-direction:column;gap:2px;font-weight:500}
.fab{position:fixed;right:14px;bottom:calc(var(--tab-h) + var(--sab) + 14px);z-index:55;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;box-shadow:var(--sh-3);display:grid;place-items:center}
@media (min-width:900px){.fab{bottom:24px}}

/* inputs */
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:600;font-size:.9rem}
.input,select.input,textarea.input{width:100%;min-height:48px;border:2px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);padding:10px 14px;font:inherit}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.input.err{border-color:var(--error)}
.hint{font-size:.8rem;color:var(--muted)}.errmsg{font-size:.82rem;color:var(--error);font-weight:500}
.phone{display:flex}.phone .cc{display:grid;place-items:center;padding:0 12px;border:2px solid var(--border-strong);border-right:0;border-radius:var(--r-md) 0 0 var(--r-md);background:var(--surface-2);font-weight:600}.phone .input{border-radius:0 var(--r-md) var(--r-md) 0}
.otp{display:flex;gap:8px;justify-content:center}.otp input{width:46px;height:54px;text-align:center;font:600 1.4rem var(--font-display);border:2px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text)}.otp input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--border-strong);border-radius:var(--r-pill);padding:0 6px 0 14px;min-height:48px}
.searchbar input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;min-height:44px;outline:none}
.searchbar:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.toggle{position:relative;width:52px;height:30px;flex:none}.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}.toggle span{position:absolute;inset:0;background:var(--border-strong);border-radius:15px;transition:background var(--dur-2)}.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform var(--dur-2) var(--ease);box-shadow:var(--sh-1)}.toggle input:checked+span{background:var(--secondary)}.toggle input:checked+span::after{transform:translateX(22px)}.toggle input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}.check input{width:22px;height:22px;accent-color:var(--primary)}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--primary);border-radius:var(--r-md);overflow:hidden}.stepper button{width:40px;height:38px;border:0;background:var(--primary-soft);color:var(--primary-ink);font-size:1.2rem;font-weight:700}.stepper b{min-width:34px;text-align:center}
.drop{border:2px dashed var(--border-strong);border-radius:var(--r-md);padding:18px;text-align:center;color:var(--muted);background:var(--surface-2)}

/* chips badges */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--border-strong);background:var(--surface);font-weight:500;font-size:.9rem;white-space:nowrap;color:var(--text)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--r-pill);font-size:.75rem;font-weight:600;line-height:1.5;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,var(--surface))}
.badge.ok{color:var(--success)}.badge.warn{color:var(--warning)}.badge.bad{color:var(--error)}.badge.info{color:var(--info)}.badge.offer{color:var(--offer)}.badge.neu{color:var(--text-2)}.badge.sec{color:var(--secondary)}
.badge.solid{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.st{color:var(--c,var(--text-2))}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.card.pad{padding:16px}
.card.hover{transition:transform var(--dur-2) var(--ease),box-shadow var(--dur-2)}.card.hover:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.auto-s{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
@media (max-width:640px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.auto{grid-template-columns:1fr}}
@media (min-width:900px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.art{position:relative;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h,25) 85% 90%),hsl(var(--h,25) 70% 76%));font-size:2.4rem;overflow:hidden;aspect-ratio:1/1}
.art.w{aspect-ratio:16/9;font-size:3.6rem}.art.f{aspect-ratio:4/3}
.art span{filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
:root[data-theme="dark"] .art,:root[data-theme="auto"] .art{--dim:1}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] .art{filter:brightness(.78)}}
:root[data-theme="dark"] .art{filter:brightness(.78)}
.lite .art span{filter:none}
.biz{display:flex;flex-direction:column}
.biz.row{flex-direction:row}.biz.row .art{width:96px;height:auto;min-height:96px;aspect-ratio:auto;font-size:2rem}
.biz .body{padding:12px;display:grid;gap:4px;min-width:0}.biz .t{font-weight:600;display:flex;gap:6px;align-items:center}
.biz .meta{display:flex;gap:6px;align-items:center;font-size:.84rem;color:var(--text-2);flex-wrap:wrap}
.pcard .body{padding:10px 12px 12px;display:grid;gap:4px}.pcard .t{font-weight:500;font-size:.92rem;line-height:1.3;min-height:2.4em}
.tile{display:grid;gap:6px;justify-items:center;text-align:center;padding:12px 6px;font-size:.82rem;font-weight:500;border-radius:var(--r-md);min-height:48px}
.tile .art{width:60px;height:60px;border-radius:18px;font-size:1.8rem}
.tile:hover .art{transform:scale(1.06)}.tile .art{transition:transform var(--dur-2) var(--ease)}
.stars{display:inline-flex;gap:1px;color:var(--star);vertical-align:middle}.stars .ic{width:15px;height:15px}.stars .e{color:var(--border-strong)}
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);scroll-snap-type:x mandatory;display:flex;overflow-x:auto;scrollbar-width:none}.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;padding:22px 20px;min-height:170px;display:grid;align-content:center;gap:8px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2))}
.slide h2{color:#fff;font-size:1.35rem}.slide p{opacity:.95}.slide .btn{justify-self:start;background:#fff;color:#1F1A14}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}.dots i.on{background:var(--primary);width:22px;border-radius:4px;transition:width var(--dur-2)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.sec h2{font-size:1.2rem}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,44%);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start}
@media (min-width:700px){.hscroll{grid-auto-columns:minmax(200px,230px)}}
.hscroll.wide{grid-auto-columns:minmax(260px,82%)}@media (min-width:700px){.hscroll.wide{grid-auto-columns:300px}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:46px;padding:0 14px;border:0;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}

function runSearch(){const q=UI.q.trim().toLowerCase(),f=UI.fl;const mt=(...a)=>!q||a.join(' ').toLowerCase().includes(q);
 let b=D().biz.filter(x=>x.status==='approved'&&(mt(x.name.en,x.name.hi,catName(x.cat),x.desc,areaName(x.area))||D().products.some(p=>p.bid===x.id&&mt(p.name.en))&&!!q&&false));
 let p=D().products.filter(x=>biz(x.bid).status==='approved'&&mt(x.name.en,x.name.hi,catName(x.cat),biz(x.bid).name.en));
 let s=D().svc.filter(x=>x.status==='approved'&&mt(x.name.en,x.name.hi,catName(x.cat),x.desc,x.services.map(y=>y.n).join(' ')));
 if(f.cat){b=b.filter(x=>x.cat===f.cat);p=p.filter(x=>x.cat===f.cat);s=s.filter(x=>x.cat===f.cat)}
 if(f.dist){b=b.filter(x=>dist(x)<=f.dist);s=s.filter(x=>dist(x)<=f.dist);p=p.filter(x=>dist(biz(x.bid))<=f.dist)}
 if(f.rating){b=b.filter(x=>x.rating>=f.rating);s=s.filter(x=>x.rating>=f.rating);p=p.filter(x=>biz(x.bid).rating>=f.rating)}
 if(f.open){b=b.filter(x=>openState(x).open);s=s.filter(x=>openState(x).open);p=p.filter(x=>openState(biz(x.bid)).open)}
 if(f.offers){const ob=new Set(D().offers.filter(o=>o.status==='active').map(o=>o.bid));b=b.filter(x=>ob.has(x.id));p=p.filter(x=>ob.has(x.bid))}
 if(f.deliver){b=b.filter(x=>delivInfo(x).ok);p=p.filter(x=>delivInfo(biz(x.bid)).ok)}
 if(f.pickup){b=b.filter(x=>x.del.pickup);p=p.filter(x=>biz(x.bid).del.pickup)}
 if(f.pmin!=='')p=p.filter(x=>x.price>=+f.pmin);if(f.pmax!=='')p=p.filter(x=>x.price<=+f.pmax);
 s=svcApplyCS(s,UI.exF.s);const so=UI.sort;const cmpB=so==='distance'||so==='relevance'?(a,c)=>dist(a)-dist(c):so==='rating'?(a,c)=>c.rating-a.rating:so==='newest'?(a,c)=>(c.since||0)-(a.since||0):0;
 if(cmpB){b.sort(cmpB);s.sort(cmpB)}
 if(so==='plow')p.sort((a,c)=>a.price-c.price);else if(so==='phigh')p.sort((a,c)=>c.price-a.price);else if(so==='rating')p.sort((a,c)=>biz(c.bid).rating-biz(a.bid).rating);else if(so==='distance')p.sort((a,c)=>dist(biz(a.bid))-dist(biz(c.bid)));else if(so==='newest')p.sort((a,c)=>(+c.id.slice(1))-(+a.id.slice(1)));
 return{b,p,s}}

const series=(seed,n,base,spread)=>Array.from({length:n},(_,i)=>Math.round(base+spread*Math.abs(Math.sin((i+1)*(seed.charCodeAt(1)||3)*1.7))));
const barChart=(vals,labels,fmt)=>{const m=Math.max(...vals,1);return `<div class="bars" role="img" aria-label="${t('Bar chart')}">${vals.map((v,i)=>`<i style="height:${Math.max(4,v/m*100)}%" title="${labels[i]}: ${fmt?fmt(v):v}"></i>`).join('')}</div><div class="row between xs muted" style="margin-top:4px">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`};
const spark=(vals,color='var(--primary)')=>{const m=Math.max(...vals),n=Math.min(...vals),w=120,h=34,pts=vals.map((v,i)=>`${i*w/(vals.length-1)},${h-(v-n)/(m-n||1)*(h-4)-2}`).join(' ');return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
const donut=(parts)=>{const tot=parts.reduce((a,p)=>a+p[1],0)||1;let a0=0;const R=40,C=2*Math.PI*R;return `<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="${t('Donut chart')}"><g transform="rotate(-90 60 60)">${parts.map(p=>{const len=p[1]/tot*C,el=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p[2]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-a0}"/>`;a0+=len;return el}).join('')}</g><text x="60" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${tot}</text></svg>`};

 if(sc==='money')body=`<form data-form="cfgMoney" class="card pad stack">${field('Default commission (%)','comm',c.commission,{type:'number',step:'0.5'})}${field('Platform fee per order (₹)','pf',c.platformFee,{type:'number'})}<h3>${t('Subscription plans')}</h3>${c.plans.map((p,i)=>`<div class="grid g3">${field('Plan','pn'+i,p.n)}${field('Price (₹/mo)','pp'+i,p.price,{type:'number'})}${field('Commission %','pc'+i,p.comm,{type:'number',step:'0.5'})}</div>`).join('')}<h3>${t('Promotion fees')}</h3>${c.promos.map((p,i)=>`<div class="grid g2">${field('Item','xn'+i,p.n)}${field('Price (₹)','xp'+i,p.price,{type:'number'})}</div>`).join('')}<button class="btn p">${t('Save')}</button></form>`;
 if(sc==='pay')body=`<div class="card pad stack">${toggle('online',c.cod!==undefined&&c.online,'Online payments (UPI, cards, net banking, wallets)','cfgT')}${toggle('cod',c.cod,'Cash on delivery / pay at pickup','cfgT')}${field('Payment gateway','gw','Razorpay (test mode)',{type:'select',opts:[['Razorpay (test mode)','Razorpay (test mode)'],['PhonePe','PhonePe'],['Cashfree','Cashfree']]})}${field('API key','key','rzp_test_••••••••')}</div>`;
 if(sc==='policy')body=`<form data-form="cfgPol" class="card pad stack">${field('Refund request window (hours after delivery)','rh',c.refundHrs,{type:'number'})}${field('Review rule','rr',c.reviewRule,{type:'textarea'})}<button class="btn p">${t('Save')}</button></form>`;
 if(sc==='notif')body=`<div class="card pad stack">${alertBox('info',t('WhatsApp Business API integration. Keys are stored encrypted.'))}${field('WhatsApp Business number','wan','+91 98765 00000')}${field('API token','wat','••••••••••••')}${toggle('wa',c.flags.whatsapp,'Enable WhatsApp messages','cfgF')}${field('SMS provider','sms','MSG91',{type:'select',opts:[['MSG91','MSG91'],['Twilio','Twilio']]})}${field('Email sender','em','hello@apnatown.in')}<button class="btn p" data-act="cfgSaved">${t('Save')}</button></div>`;
 if(sc==='seo')body=`<form data-form="cfgSeo" class="card pad stack">${field('Default title','title',c.seo.title)}${field('Default description','desc',c.seo.desc,{type:'textarea'})}<div class="small muted">${t('Preview')}</div><div class="card pad"><div style="color:var(--info)">${esc(c.seo.title)}</div><div class="small" style="color:var(--success)">apnatown.in › padrauna</div><div class="small t2">${esc(c.seo.desc)}</div></div><button class="btn p">${t('Save')}</button></form>`;
 if(sc==='flags')body=`<div class="card pad stack">${Object.entries(c.flags).map(([k,v])=>toggle(k,v,({reviews:'Customer reviews',guestBrowse:'Guest browsing',whatsapp:'WhatsApp messages',booking:'Service booking (future)',donations:'Donations (future)'})[k]||k,'cfgF')).join('')}</div>`;
 if(sc==='legal')body=`<div class="stack">${['Terms of use','Privacy policy','Refund policy','About us'].map(x=>`<div class="card pad row between"><span>${t(x)}</span><button class="btn g sm" data-act="cfgSaved">${t('Edit')}</button></div>`).join('')}</div>`;
 return `<div class="stack-lg"><h1>${t('Global settings')}</h1><div class="chips">${SEC.map(([k,l])=>`<button class="chip ${sc===k?'on':''}" data-act="xsec" data-v="${k}">${t(l)}</button>`).join('')}</div>${body}<a class="btn g" href="#acats" style="justify-self:start">${t('Manage categories')}</a></div>`};

const lum=h=>{const c=h.replace('#','').match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{const l1=lum(a),l2=lum(b),h=Math.max(l1,l2),l=Math.min(l1,l2);return (h+.05)/(l+.05)};

const lev=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]};
function similarSub(main,name){const n=(name||'').trim().toLowerCase();if(n.length<3)return null;const pool=[...D().subs.filter(s=>s.status!=='rejected').map(s=>({en:s.en,main:s.main,st:s.status})),...D().products.filter(p=>p.cat===main).map(p=>({en:p.sub,main,st:'approved'}))];return pool.find(x=>{const e=x.en.toLowerCase();return e===n||e.includes(n)||n.includes(e)||lev(e,n)<=Math.max(2,Math.round(Math.min(e.length,n.length)*.25))})||null}

function xData(){const c=UI.xc,n=c.range==='7d'?7:c.range==='30d'?15:13;if(c.city!=='all'&&c.city!=='padrauna')return[];const base={orders:42,revenue:46000,deliveries:34}[c.metric]*(c.city==='all'?1:.9),lab=i=>c.range==='7d'?lastDays(7)[i]:c.range==='30d'?'D'+(i*2+1):'W'+(i+1);let prev=base,out=[];for(let i=0;i<n;i++){const o=prev,r=Math.sin((i+2)*(c.metric.length+.7))*.5+Math.cos(i*1.7+c.range.length)*.35,cl=Math.max(base*.4,o*(1+r*.2)),hi=Math.max(o,cl)*(1+.05+.04*Math.abs(Math.sin(i*2.1))),lo=Math.min(o,cl)*(1-.05-.04*Math.abs(Math.cos(i*1.3)));out.push({l:lab(i),o,h:hi,lw:lo,c:cl});prev=cl}return out}
function xSvg(d){const W=600,H=230,pl=44,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=H-pt-pb,mx=Math.max(...d.map(x=>x.h))*1.05,mn=Math.min(...d.map(x=>x.lw))*.9,y=v=>pt+ih-(v-mn)/(mx-mn||1)*ih,bw=iw/d.length;
